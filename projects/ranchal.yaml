project:
  title: Ranchal 28 km

gpx:
  file: gpx/28 km Ranchal.gpx

video:
  mode: DEV
  duration: 30
  fps: 20
  size: 854x480
  output: output/video/ranchal.mp4

camera:
  mode: stage
  preset: cinematic

timeline:
  - preset: drone
    duration: 5
    transition: 0

  - preset: cinematic
    duration: 12
    transition: 2

  - preset: helicopter
    duration: 8
    transition: 2

  - preset: arrival
    duration: 5
    transition: 2

track:
  radius: 7
  sides: 8
  progressive: true
  update_every: 10